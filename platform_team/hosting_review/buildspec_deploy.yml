# The deploy step of the hosting review (CodeBuild). It runs after the Grant step made the agent's execution role.
# The install phase sets up Node 22, Python 3.13, uv and the pinned AgentCore CLI (the commands Task 0's spike ran).
# The build phase gets the hub's code bundle and runs deploy_build.py: it reads the submission, makes the CLI project
# from the platform's runtime_skeleton, runs `agentcore deploy` under ROLE_ARN, and writes the Runtime ARN to SSM.
# UV_NO_CONFIG: the CLI's packager runs uv inside the team's code folder, and uv reads no config file from there
# (a uv.toml could otherwise choose the package index). deploy_build.py also deletes such files from the code.
# Variables per run: AGENT, CODE_KEY, CODE_VERSION, ROLE_ARN. On the project: BUCKET, PREFIX, TOOL_GW_URL, MODEL_ID.
version: 0.2
env:
  shell: bash
  variables:
    AGENTCORE_CLI: /tmp/cli/node_modules/.bin/agentcore
    AGENTCORE_TELEMETRY_DISABLED: "1"
    UV_NO_CONFIG: "1"
phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.13
    commands:
      - python3 -m pip install --quiet uv
      - ln -sf "$(python3 -c 'import uv; print(uv.find_uv_bin())')" /usr/local/bin/uv
      - npm install --no-audit --no-fund --loglevel=error --prefix /tmp/cli @aws/agentcore@1.0.3
      - echo "node $(node --version), $(uv --version), agentcore $($AGENTCORE_CLI --version)"
  build:
    commands:
      - echo "deploy $AGENT, s3://$BUCKET/$CODE_KEY version $CODE_VERSION"
      - aws s3 cp "s3://$BUCKET/platform/platform_team.zip" /tmp/hub.zip --quiet
      - rm -rf /tmp/hub && unzip -q /tmp/hub.zip -d /tmp/hub
      - PYTHONPATH=/tmp/hub python3 -m platform_team.hosting_review.deploy_build
