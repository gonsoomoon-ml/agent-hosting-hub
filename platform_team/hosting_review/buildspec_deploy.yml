# The deploy step of the hosting review (CodeBuild). It runs after the Grant step made the agent's execution role.
# The install phase sets up Python 3.13 and uv (pinned to 0.10.8, the version the deploy builds of 2026-11-22 ran
# with on this image). The build phase gets the hub's code bundle and runs deploy_build.py: it
# reads the submission, installs the lines the scan audited as wheels for the Runtime's platform, packages them with the
# submission's .py files, creates or updates the agent's Runtime under ROLE_ARN (CreateAgentRuntime,
# UpdateAgentRuntime), and writes the Runtime ARN to SSM.
# UV_NO_CONFIG: uv reads no config file (a uv.toml could otherwise choose the package index). deploy_build.py also
# deletes such files from the submission, and installs wheels only, so no setup.py of the submission's packages runs.
# Variables per run: AGENT, CODE_KEY, CODE_VERSION, ROLE_ARN. On the project: BUCKET, PREFIX, TOOL_GW_URL, MODEL_ID.
version: 0.2
env:
  shell: bash
  variables:
    UV_NO_CONFIG: "1"
phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python3 -m pip install --quiet uv==0.10.8
      - ln -sf "$(python3 -c 'import uv; print(uv.find_uv_bin())')" /usr/local/bin/uv
      - echo "$(python3 --version), $(uv --version)"
  build:
    commands:
      - echo "deploy $AGENT, s3://$BUCKET/$CODE_KEY version $CODE_VERSION"
      - aws s3 cp "s3://$BUCKET/platform/platform_team.zip" /tmp/hub.zip --quiet
      - rm -rf /tmp/hub && unzip -q /tmp/hub.zip -d /tmp/hub
      - PYTHONPATH=/tmp/hub python3 -m platform_team.hosting_review.deploy_build
