# The scan step of the hosting review (CodeBuild). It reads the team's submission at the object version the
# catalog record names, refuses a broken one (unsafe paths, no main.py or requirements.txt, a requirements line
# that is not a package on the index), and runs pip-audit on its requirements.txt. A known vulnerability fails the
# build, and the review stops before anything is granted.
# No Python runs from the submission's folder: pip-audit runs in isolated mode (-I) from an empty folder, so no
# file of the submission can stand in for pip-audit or pip. PIP_ONLY_BINARY keeps pip from running the setup.py
# of an sdist, as the deploy's packager does (--only-binary :all:).
# Variables per run: AGENT, CODE_KEY, CODE_VERSION. On the project: BUCKET, PREFIX.
version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python3 -m pip install --quiet pip-audit
      - echo "$(python3 --version), pip-audit $(python3 -m pip_audit --version | awk '{print $2}')"
  build:
    commands:
      - echo "scan $AGENT, s3://$BUCKET/$CODE_KEY version $CODE_VERSION"
      - aws s3 cp "s3://$BUCKET/platform/platform_team.zip" /tmp/hub.zip --quiet
      - rm -rf /tmp/hub && unzip -q /tmp/hub.zip -d /tmp/hub
      - aws s3api get-object --bucket "$BUCKET" --key "$CODE_KEY" --version-id "$CODE_VERSION" /tmp/submission.zip > /dev/null
      - PYTHONPATH=/tmp/hub python3 -m platform_team.hosting_review.submission_check /tmp/submission.zip /tmp/src
      - 'mkdir -p /tmp/audit && cd /tmp/audit && PIP_ONLY_BINARY=:all: python3 -I -m pip_audit -r /tmp/src/requirements.txt --progress-spinner off'
