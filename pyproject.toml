[project]
name = "agentcore-agent-hosting-hub"
version = "0.1.0"
description = "AI agent hosting hub on Amazon Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = ["boto3>=1.44.9"]

[dependency-groups]
dev = ["pytest", "pyyaml>=6.0.4"]   # pyyaml: the tests read the buildspecs

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_team*"]

[tool.setuptools.package-data]
"platform_team.company_policy" = ["policy_templates/*.cedar"]
"platform_team.hosting_review" = ["runtime_skeleton/*.tmpl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
