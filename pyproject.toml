[project]
name = "agent-hosting-hub"
version = "0.1.0"
description = "AI agent hosting hub on Amazon Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = ["boto3>=1.44.9"]

[dependency-groups]
dev = ["pytest", "pyyaml>=6.0.4", "langgraph", "strands-agents", "google-adk==2.14.1"]   # pyyaml: the tests read the buildspecs; langgraph, strands-agents, google-adk: the example agents' tests (google-adk at the version docs_adk pins)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_team*"]

[tool.setuptools.package-data]
"platform_team.company_policy" = ["policy_templates/*.cedar"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
