[project]
name = "agent-hosting-hub"
version = "0.1.0"
description = "AI agent hosting hub on Amazon Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = ["boto3>=1.44.9"]

[dependency-groups]
ui = ["fastapi>=0.165.0", "jinja2>=3.1.6", "uvicorn>=0.54.0", "python-multipart>=0.0.34", "httpx>=0.28.1"]   # the local hub screen (platform_team/hub_ui)
dev = [{include-group = "ui"}, "pytest", "pyyaml>=6.0.4", "langgraph", "strands-agents", "google-adk==2.14.1"]   # pyyaml: the tests read the buildspecs; langgraph, strands-agents, google-adk: the example agents' tests (google-adk at the version docs_adk pins)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_team*"]

[tool.setuptools.package-data]
"platform_team.company_policy" = ["policy_templates/*.cedar"]
"platform_team.hub_ui" = ["templates/*.html", "static/*.png"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
